<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Killstate">
  <title>Killstate</title>

  <style>
    :root {
      --bg: #050505;
      --text: #f3f3f3;
      --muted: #9a9a9a;
      --line: #242424;
      --max: 1180px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
      color-scheme: dark;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% -20%, #181818 0, #0a0a0a 32%, var(--bg) 64%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a {
      color: inherit;
    }

    .page {
      width: min(calc(100% - 40px), var(--max));
      margin: 0 auto;
      padding: 72px 0 42px;
    }

    .brand {
      margin: 0 0 58px;
      text-align: center;
    }

    .brand img {
      display: block;
      width: min(760px, 88vw);
      height: auto;
      margin: 0 auto;
    }

    .releases {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 28px;
      align-items: start;
    }

    .release h2 {
      margin: 0 0 14px;
      text-align: center;
      font-size: clamp(1rem, 1.7vw, 1.25rem);
      letter-spacing: 0.18em;
      font-weight: 700;
      text-transform: uppercase;
    }

    .video {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #111;
      border: 1px solid var(--line);
    }

    .video iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .credit {
      margin: 28px 0 0;
      text-align: center;
      color: var(--muted);
      font-size: 0.92rem;
      letter-spacing: 0.04em;
    }

    .credit strong {
      color: #cfcfcf;
      font-weight: 600;
    }

    footer {
      margin-top: 68px;
      padding-top: 28px;
      border-top: 1px solid var(--line);
      text-align: center;
    }

    .socials {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px 22px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .socials a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: color 150ms ease;
    }

    .socials a:hover,
    .socials a:focus-visible {
      color: var(--text);
    }

    .copyright {
      margin: 24px 0 0;
      color: #555;
      font-size: 0.75rem;
    }

    @media (max-width: 760px) {
      .page {
        width: min(calc(100% - 24px), var(--max));
        padding-top: 44px;
      }

      .brand {
        margin-bottom: 42px;
      }

      .releases {
        grid-template-columns: 1fr;
        gap: 38px;
      }

      .credit {
        margin-top: 24px;
      }

      footer {
        margin-top: 52px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <h1 class="brand"><img src="killstate-logo.png" alt="Killstate"></h1>

    <section class="releases" aria-label="Killstate releases">
      <article class="release">
        <h2>Ultra Vires</h2>
        <div class="video">
          <!-- Replace jbmzih493OY with the ID from the YouTube URL.
               Example: youtube.com/watch?v=abc123 -> abc123 -->
          <iframe
            src="https://www.youtube-nocookie.com/embed/jbmzih493OY"
            title="Killstate - Ultra Vires"
            loading="lazy"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
          </iframe>
        </div>
      </article>

      <article class="release">
        <h2>Your Blood &amp; Soul</h2>
        <div class="video">
          <!-- Replace QMIKK6c8AJo with the ID from the YouTube URL. -->
          <iframe
            src="https://www.youtube-nocookie.com/embed/QMIKK6c8AJo"
            title="Killstate - Your Blood & Soul"
            loading="lazy"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
          </iframe>
        </div>
      </article>
    </section>

    <p class="credit">
      Mixed by <strong>Matt Bayles</strong> · Mastered by <strong>Ted Jensen</strong>
    </p>

    <footer>
      <ul class="socials">
        <li><a href="https://www.youtube.com/@KillstateMusic" target="_blank" rel="noopener noreferrer">YouTube</a></li>
        <li><a href="https://open.spotify.com/artist/2EJGZSHFtj41nwn0u7Kydl" target="_blank" rel="noopener noreferrer">Spotify</a></li>
        <li><a href="https://music.apple.com/us/artist/killstate/6794086541" target="_blank" rel="noopener noreferrer">Apple Music</a></li>
        <li><a href="https://thisiskillstate.bandcamp.com/" target="_blank" rel="noopener noreferrer">Bandcamp</a></li>
      </ul>

      <p class="copyright">&copy; Killstate</p>
    </footer>
  </main>
</body>
</html>
